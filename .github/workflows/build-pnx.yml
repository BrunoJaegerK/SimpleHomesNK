name: Build SimpleHomesNK for PowerNukkitX beta

on:
  push:
    branches:
      - port/powernukkitx
  pull_request:
    branches:
      - port/powernukkitx
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build plugin
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Upload plugin JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SimpleHomes-PNX
          path: target/SimpleHomes-PNX.jar
          if-no-files-found: error
