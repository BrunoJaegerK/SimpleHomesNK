name: SimpleHomesNk
main: com.brunojaegerk.simplehomes.SimpleHomes
version: "1.0.0-pnx"
api: ["2.0.0"]
author: BrunoJaegerK
description: Sistema de hogares para PowerNukkitX beta con formularios nativos

commands:
  homes:
    description: Abre el menú de hogares
    usage: "/homes"
    permission: simplehomes.command.homes

permissions:
  simplehomes.command.homes:
    default: true
  simplehomes.command.sethome:
    default: true
  simplehomes.command.home:
    default: true
  simplehomes.command.delhome:
    default: true
  simplehomes.limit.3:
    default: false
  simplehomes.limit.5:
    default: false
  simplehomes.limit.7:
    default: false
  simplehomes.limit.10:
    default: false
